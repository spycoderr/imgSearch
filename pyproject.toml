[project]
name = "imgsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.116",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "imagehash>=4.3.2",
    "mlx-vlm>=0.7.9",
    "numpy>=2.5.4",
    "ocrmac>=1.0.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "protobuf>=7.36.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyobjc-framework-vision>=12.2.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.2",
    "sqlite-vec>=0.1.9",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Don't reformat code sketches in the plan doc and README.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
imgsearch = "imgsearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
