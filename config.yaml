# imgsearch configuration. Relative paths resolve against the folder holding this file.

# Storage layout (plan D18). The pen drive holds the originals and the derivatives; the Mac
# keeps the DB, the thumbnails and the inbox, so search works with the drive unplugged.
# Eject the drive before unplugging it. IMGSEARCH_STORAGE_ROOT is set in .env (git-ignored;
# see .env.example), so moving the storage means editing .env only.
originals_root: "${IMGSEARCH_STORAGE_ROOT}/originals"      # only `imgsearch import` adds files
derivatives_root: "${IMGSEARCH_STORAGE_ROOT}/derivatives"  # 2048px derivative JPEGs
thumbs_root: data/thumbs        # 256px thumbnails
db_path: data/imgsearch.db      # never under /Volumes (rejected by config validation)
inboxes:                        # `imgsearch import` moves photos from here to originals_root
  - data/inbox/phone            # Syncthing, receive-only (plan D20)
  - data/inbox/camera           # Syncthing, receive-only: the phone's camera folder

models:
  embedder:
    name: google/siglip2-base-patch16-384
    dim: 768
    device: mps
    text_max_length: 64   # model card: pad/truncate text to 64 tokens, as in training
  captioner:
    name: mlx-community/Qwen3-VL-4B-Instruct-4bit
    prompt: >-
      Describe what this photo shows in one or two short English sentences.
      If the photo contains readable text, add it after the description, copied exactly.
      Do not mention text if there is none.
    max_tokens: 100
    # Images are downscaled to at most this many pixels before captioning, keeping the
    # aspect ratio. The VLM uses ~1 token per 32x32 px, so this caps a prompt at ~1k image
    # tokens. An area cap (not a long edge) keeps panoramas tall enough to read.
    max_pixels: 1048576  # 1024 x 1024
  rewriter:
    name: "qwen2.5:7b"
    url: "http://localhost:11434"
    timeout_s: 30  # a cold start loads the model first
    prompt: |
      You rewrite search queries for a personal photo library. A query can be in English,
      Hindi (Devanagari script) or Hinglish (Hindi written in Latin letters, often mixed
      with English). Today's date is {today}.

      Return JSON with these fields:
      - english: the query translated into English. Translate every Hindi and Hinglish
        word, and keep every object, food, animal, person, place and action the query
        mentions. Relations become English words (mummy -> mom, papa -> dad, dadi ->
        grandma, bhai -> brother). Keep names of people and places as written, in Latin
        letters. If the query is already in English, copy it exactly, word for word,
        keeping "the", "a" and every other word.
      - people: the humans the query mentions, by name or relation (for example "mummy",
        "Rahul", "dadi"), exactly as written in the query. Animals and objects are not
        people. An empty list if none.
      - place: the name of a city, country or landmark the query mentions, as written,
        or null. Common places like "park", "beach" or "home" are not place names.
      - date_range: only if the query names a date: a year, a day or a month ("2019",
        "15 August", "15-16 sept"), a weekday ("on saturday") or a relative day
        ("yesterday", "kal", "last week", "pichle mahine"). Return {"start": "YYYY-MM-DD",
        "end": "YYYY-MM-DD"} covering it, worked out from today's date. A day or month
        without a year is its most recent one on or before today; a weekday is the day
        with that name in the seven days listed above; "kal" means yesterday. Otherwise null.

      Rules:
      - Use only what the query says. Never add people, places, dates, objects or
        other details that are not in the query.
      - Do not guess a date from a festival, season or event name.

      Examples:
      Query: papa ke saath beach pe ice cream khate hue
      {"english": "eating ice cream on the beach with dad", "people": ["papa"], "place": null, "date_range": null}
      Query: चाचा की गाय खेत में 2019
      {"english": "uncle's cow in the field 2019", "people": ["चाचा"], "place": null, "date_range": {"start": "2019-01-01", "end": "2019-12-31"}}
      Query: Shimla wale hotel ka room
      {"english": "the hotel room in Shimla", "people": [], "place": "Shimla", "date_range": null}
      Query: the receipt from the hardware store
      {"english": "the receipt from the hardware store", "people": [], "place": null, "date_range": null}
    # A date_range from the model is kept only if the query has a digit date (2019, 15/08)
    # or one of these words or phrases (matched as whole words, any case); otherwise the
    # model invented it (review W1).
    date_words: [
      # English months
      january, february, march, april, may, june, july, august, september, october,
      november, december, jan, feb, mar, apr, jun, jul, aug, sep, sept, oct, nov, dec,
      weekend,
      # English relative words
      yesterday, today, tonight, ago, last week, last month, last year, this week,
      this month, this year,
      # Hinglish
      kal, aaj, parso, parson, pichle, pichhle, pichla, pichhla, pichli, hafte, hafta,
      mahine, mahina, saal,
      # Hindi
      कल, आज, परसों, पिछले, पिछला, पिछली, हफ्ते, हफ़्ते, महीने, साल, जनवरी, फरवरी, फ़रवरी,
      मार्च, अप्रैल, मई, जून, जुलाई, अगस्त, सितंबर, सितम्बर, अक्टूबर, नवंबर, नवम्बर, दिसंबर,
      दिसम्बर,
    ]
    # Weekdays are worked out in code, not by the model: the most recent such day before
    # today (qwen2.5:7b got them wrong in the P1.7 eval). They also count as date words.
    weekdays:
      monday: [monday, mon, somvar, somwar, सोमवार]
      tuesday: [tuesday, tue, tues, mangalvar, mangalwar, मंगलवार]
      wednesday: [wednesday, wed, budhvar, budhwar, बुधवार]
      thursday: [thursday, thu, thur, thurs, guruvar, guruwar, गुरुवार]
      friday: [friday, fri, shukravar, shukrawar, शुक्रवार]
      saturday: [saturday, sat, shanivar, shaniwar, शनिवार]
      sunday: [sunday, sun, ravivar, raviwar, itwar, रविवार]
  ocr:  # Apple Vision via ocrmac; text in photos is mostly English (plan D6)
    recognition_level: accurate
    languages: ["en-US"]

# Stage versions. Bump one to re-run that stage on every image.
stages:
  ingest: "2"
  embed: "2"
  ocr: "1"
  caption: "1"
  filename: "1"

search:
  top_k: 5
  per_retriever_k: 10   # each retriever's list for RRF; 10 beat 20 and 50 in the M7 eval
  rrf_k: 60
  # Retrievers `search` uses when none are given (`--signals`). vector alone with the
  # rewrite beat vector+text on the M7 baseline (docs/mvp-summary.md, decision 1).
  default_signals: [vector]
  # RRF weight per signal: score = sum of weight / (rrf_k + rank). 1.0 = plain RRF.
  signal_weights: {vector: 1.0, text: 1.0}

eval:
  queries: eval/queries.yaml   # the labelled query set
  runs_dir: eval/runs          # one folder per run; git-ignored (personal photos)

# Originals' primary home (plan D19, P1.6): S3 Glacier Instant Retrieval, encrypted on the Mac
# (AES-256-GCM; the key is in the macOS Keychain). The bucket name and the AWS profile come
# from .env (git-ignored; see .env.example); credentials stay in ~/.aws/.
s3:
  bucket: "${IMGSEARCH_S3_BUCKET}"
  profile: "${AWS_PROFILE}"
  region: ap-south-1
  storage_class: GLACIER_IR
  originals_prefix: originals/       # objects are originals/<image id>: no names or dates
  db_key: db/imgsearch.sqlite.enc    # encrypted DB copy; bucket versioning keeps older ones
  keychain_service: imgsearch-s3     # Keychain item holding the encryption key
  keychain_account: encryption-key

# The pen drive is a least-recently-used cache of originals. `imgsearch evict` removes the
# least recently used ones (only those with a verified S3 copy) until their total size is
# under this cap. Sizes are file sizes; exFAT adds ~8% on disk.
storage:
  cache_max_gb: 20

# Syncthing's local REST API, read only: `imgsearch backfill folders` reads which phone folder
# each already-imported photo came from. The API key is SYNCTHING_API_KEY in .env.
syncthing:
  url: "http://127.0.0.1:8384"

# The chat bot (P3, plan D13): `imgsearch bot`. Secrets (bot token, allowed user ids) come
# from .env (git-ignored; see .env.example).
chat:
  adapter: telegram       # telegram, or whatsapp (parked: Meta keeps the account locked, P3 report)
  max_results: 20         # per search; `more` pages through them, search.top_k at a time
  idle_unload_s: 300      # SigLIP unloads after 5 idle minutes, like Ollama's keep_alive (D21)

telegram:                 # long polling: no webhook, no open port
  api_url: https://api.telegram.org
  poll_timeout_s: 30      # getUpdates waits this long for a message
  timeout_s: 60           # per request, uploads included
  original_max_mb: 50     # the Bot API's upload limit for documents

whatsapp:                 # parked; webhook server on 127.0.0.1, public through a tunnel
  graph_url: https://graph.facebook.com
  api_version: v26.0
  port: 8765
  timeout_s: 30
  original_max_mb: 100    # WhatsApp's document size limit
