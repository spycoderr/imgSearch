# imgsearch configuration. Relative paths resolve against the folder holding this file.

originals_root: data/originals      # read-only; later an external HDD mount
derivatives_root: data/derivatives  # derivative JPEGs and 256px thumbnails
db_path: data/imgsearch.db

models:
  embedder:
    name: google/siglip2-base-patch16-384
    dim: 768
    device: mps
    text_max_length: 64   # model card: pad/truncate text to 64 tokens, as in training
  captioner:
    name: mlx-community/Qwen3-VL-4B-Instruct-4bit
    prompt: >-
      Describe what this photo shows in one or two short English sentences.
      If the photo contains readable text, add it after the description, copied exactly.
      Do not mention text if there is none.
    max_tokens: 100
    # Images are downscaled to at most this many pixels before captioning, keeping the
    # aspect ratio. The VLM uses ~1 token per 32x32 px, so this caps a prompt at ~1k image
    # tokens. An area cap (not a long edge) keeps panoramas tall enough to read.
    max_pixels: 1048576  # 1024 x 1024
  rewriter:
    name: "qwen2.5:3b"
    url: "http://localhost:11434"
  ocr:  # Apple Vision via ocrmac; text in photos is mostly English (plan D6)
    recognition_level: accurate
    languages: ["en-US"]

# Stage versions. Bump one to re-run that stage on every image.
stages:
  ingest: "2"
  embed: "2"
  ocr: "1"
  caption: "1"

search:
  top_k: 5
  per_retriever_k: 50
  rrf_k: 60
